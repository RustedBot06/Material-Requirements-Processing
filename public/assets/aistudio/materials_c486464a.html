
<!DOCTYPE html>
<html>

<head>
    <title>Raw Materials - Chips MRP</title>
</head>

<body>

    <h1>Raw Materials Inventory</h1>

    <!-- ADD NEW MATERIAL -->

    <h2>Add New Material</h2>

    <form method="POST">

        <label>Material Name:</label>
        <input type="text" name="material_name" required>

        <br><br>

        <label>Unit:</label>
        <select name="unit" required>
            <option value="kg">Kilogram</option>
            <option value="litre">Litre</option>
            <option value="piece">Piece</option>
        </select>

        <br><br>

        <label>Available Stock:</label>
        <input type="number" name="stock_qty"
               min="0" step="any" required>

        <br><br>

        <label>Cost Per Unit:</label>
        <input type="number" name="cost_per_unit"
               min="0" step="any" required>

        <br><br>

        <button type="submit">Add Material</button>

    </form>

    <hr>

    <!-- DISPLAY AND EDIT INVENTORY -->

    <h2>Current Inventory</h2>

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Material</th>
            <th>Unit</th>
            <th>Available Stock</th>
            <th>Cost Per Unit</th>
            <th>Actions</th>
        </tr>

        {% for material in materials %}

        <tr>

            <!-- EDIT FORM ASSOCIATED WITH THIS ROW -->

            <td>
                <form id="edit-{{ material['id'] }}"
                      method="POST"
                      action="{{ url_for('update_material', material_id=material['id']) }}">
                </form>

                {{ material["id"] }}
            </td>

            <td>
                <input form="edit-{{ material['id'] }}"
                       type="text"
                       name="material_name"
                       value="{{ material['material_name'] }}"
                       required>
            </td>

            <td>
                <select form="edit-{{ material['id'] }}"
                        name="unit" required>

                    <option value="kg"
                        {% if material["unit"] == "kg" %}selected{% endif %}>
                        Kilogram
                    </option>

                    <option value="litre"
                        {% if material["unit"] == "litre" %}selected{% endif %}>
                        Litre
                    </option>

                    <option value="piece"
                        {% if material["unit"] == "piece" %}selected{% endif %}>
                        Piece
                    </option>

                </select>
            </td>

            <td>
                <input form="edit-{{ material['id'] }}"
                       type="number"
                       name="stock_qty"
                       value="{{ material['stock_qty'] }}"
                       min="0" step="any" required>
            </td>

            <td>
                <input form="edit-{{ material['id'] }}"
                       type="number"
                       name="cost_per_unit"
                       value="{{ material['cost_per_unit'] }}"
                       min="0" step="any" required>
            </td>

            <!-- ACTION BUTTONS -->

            <td>

                <button type="submit"
                        form="edit-{{ material['id'] }}">
                    Update
                </button>

                <form method="POST"
                      action="{{ url_for('delete_material', material_id=material['id']) }}"
                      onsubmit="return confirm('Are you sure you want to delete this material?');">

                    <button type="submit">Delete</button>

                </form>

            </td>

        </tr>

        {% endfor %}

    </table>

</body>
</html>
