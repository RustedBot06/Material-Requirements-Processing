
<!DOCTYPE html>
<html>
<head>
    <title>Production Schedule</title>
</head>

<body>

    <h1>Production Schedule</h1>

    <nav>
        <a href="{{ url_for('materials') }}">Raw Materials</a> |
        <a href="{{ url_for('products') }}">Products</a> |
        <a href="{{ url_for('bom') }}">BOM</a>
    </nav>

    <hr>

    <h2>Add Production Schedule</h2>

    <form action="{{ url_for('schedule') }}" method="POST">

        <label>Product:</label>

        <select name="product_id" required>
            <option value="">Select Product</option>

            {% for product in products %}
                <option value="{{ product['id'] }}">
                    {{ product['name'] }} - {{ product['packet_size'] }}g
                </option>
            {% endfor %}

        </select>

        <br><br>

        <label>Production Date:</label>
        <input type="date" name="date" value="{{ today }}" required>

        <br><br>

        <label>Planned Quantity:</label>
        <input type="number" name="planned_qty" min="0" step="1" required>

        <br><br>

        <label>Actual Quantity:</label>
        <input type="number" name="actual_qty" min="0" step="1" value="0" required>

        <br><br>

        <button type="submit">Add Schedule</button>

    </form>

    <hr>

    <h2>Existing Production Schedules</h2>

    <table border="1" cellpadding="8">

        <thead>
            <tr>
                <th>ID</th>
                <th>Product</th>
                <th>Date</th>
                <th>Planned Quantity</th>
                <th>Actual Quantity</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for record in records %}

                <tr>

                    <td>
                        {{ record['id'] }}

                        <form id="edit-{{ record['id'] }}"
                              action="{{ url_for('update_schedule', schedule_id=record['id']) }}"
                              method="POST">
                        </form>
                    </td>

                    <td>
                        {{ record['product_name'] }} - {{ record['packet_size'] }}g
                    </td>

                    <td>
                        <input type="date"
                               name="date"
                               value="{{ record['date'] }}"
                               form="edit-{{ record['id'] }}"
                               required>
                    </td>

                    <td>
                        <input type="number"
                               name="planned_qty"
                               value="{{ record['planned_qty'] }}"
                               min="0"
                               step="1"
                               form="edit-{{ record['id'] }}"
                               required>
                    </td>

                    <td>
                        <input type="number"
                               name="actual_qty"
                               value="{{ record['actual_qty'] }}"
                               min="0"
                               step="1"
                               form="edit-{{ record['id'] }}"
                               required>
                    </td>

                    <td>

                        <button type="submit"
                                form="edit-{{ record['id'] }}">
                            Update
                        </button>

                        <form action="{{ url_for('delete_schedule', schedule_id=record['id']) }}"
                              method="POST"
                              style="display:inline;"
                              onsubmit="return confirm('Delete this production schedule?');">

                            <button type="submit">Delete</button>

                        </form>

                    </td>

                </tr>

            {% endfor %}

        </tbody>

    </table>

</body>
</html>
